[package]
name = "cs2_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
image = "0.25.10"
nalgebra = "0.34.2"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.12", features = ["cuda"] }
pathfinding = "4.15.0"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6.1"
scap = "0.0.8"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
